services:
  postgres:
    image: postgres:17-alpine
    container_name: freightfox-postgres
    environment:
      POSTGRES_DB: freightfox
      POSTGRES_USER: freightfox
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - freightfox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightfox -d freightfox"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freightfox-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/freightfox
      DB_USERNAME: freightfox
      DB_PASSWORD: local_dev_password
      DB_DDL_AUTO: update
      DB_POOL_SIZE: "5"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  freightfox_pgdata: