services:
  postgres:
    image: postgres:17-alpine
    container_name: freightfox-postgres
    environment:
      POSTGRES_DB: freightfox
      POSTGRES_USER: freightfox
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - freightfox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightfox -d freightfox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  freightfox_pgdata: