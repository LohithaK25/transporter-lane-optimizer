spring.application.name=transport-optimizer

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/freightfox}
spring.datasource.username=${DB_USERNAME:freightfox}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Server
server.address=0.0.0.0
server.port=${PORT:8080}